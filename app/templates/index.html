<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清分样本卡号脱敏下载</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --border: #dce1ea;
    --text: #1f2733;
    --muted: #667085;
    --primary: #1f5eff;
    --primary-soft: #e8efff;
    --danger: #d92d20;
    --danger-soft: #fef3f2;
    --ok: #067647;
    --ok-soft: #ecfdf3;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
  }
  header {
    background: linear-gradient(120deg, #102a6b, #1f5eff);
    color: #fff;
    padding: 18px 28px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 650; }
  header p { margin: 4px 0 0; opacity: .82; font-size: 13px; }
  .layout {
    max-width: 1280px;
    margin: 22px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 15px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    width: 100%;
    padding: 10px;
    font-weight: 600;
  }
  .btn-primary:hover { background: #1a4fd6; color: #fff; }
  .btn-primary:disabled { background: #a9bff5; border-color: #a9bff5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .file-name {
    margin-top: 8px;
    font-size: 12px;
    color: var(--ok);
    word-break: break-all;
  }
  select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: var(--text);
    margin-bottom: 10px;
  }
  select:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
  .field-list {
    max-height: 320px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 6px;
  }
  .field-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    cursor: pointer;
    border-bottom: 1px solid #f0f2f6;
  }
  .field-item:last-child { border-bottom: none; }
  .field-item:hover { background: var(--primary-soft); }
  .field-item input { accent-color: var(--primary); }
  .field-item.target { background: var(--primary-soft); font-weight: 600; }
  .model-chip {
    display: inline-block;
    padding: 2px 8px;
    background: #f2f4f7;
    border-radius: 12px;
    font-size: 11.5px;
    color: #475467;
    margin: 2px 4px 2px 0;
  }
  .model-chip .arr { color: #98a2b3; margin: 0 3px; }
  .alert {
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 14px;
    display: flex;
    gap: 8px;
  }
  .alert-error { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecdca; }
  .alert-info { background: var(--primary-soft); color: #1849a9; border: 1px solid #b2ccff; }
  .alert-ok { background: var(--ok-soft); color: var(--ok); border: 1px solid #abefc6; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    background: #fbfcfe;
  }
  .stat .num { font-size: 24px; font-weight: 700; color: var(--primary); }
  .stat .lbl { font-size: 12px; color: var(--muted); }
  .col-table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .col-table th, .col-table td {
    text-align: left;
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid #f0f2f6;
  }
  .col-table th {
    background: #fcfdff;
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
  }
  .col-table tr:last-child td { border-bottom: none; }
  .col-name { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .big { font-size: 38px; margin-bottom: 8px; }
  .upstream-trees { font-size: 12px; color: #475467; margin-top: 8px; }
  .meta-line { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .preview {
    background: #0f172a;
    color: #d7e0f4;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    max-height: 300px;
    overflow: auto;
    white-space: pre;
    margin-top: 10px;
  }
  .loading-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.6);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .loading-mask.show { display: flex; }
  .loading-box {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #cfd8ec;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>清分样本卡号脱敏下载</h1>
  <p>沿模型的选列与改名把等值 INNER JOIN 连接键追溯到源列，连通的卡号列整体换号，下载不含原号对照的样本包</p>
</header>

<div class="layout">
  <!-- 左侧：载入与选择 -->
  <div>
    <div class="panel">
      <h2><span class="step-badge">1</span>载入样本包 JSON</h2>
      <div class="btn-row">
        <button class="btn" id="btn-sample">载入本地样例</button>
        <label class="btn" style="margin:0">
          上传 JSON
          <input type="file" id="file-input" accept=".json,application/json" hidden>
        </label>
      </div>
      <div class="file-name" id="file-name"></div>
      <p class="hint">JSON 需包含 <code>source_tables</code>（含 <code>columns</code> 与样本行 <code>rows</code>）和 <code>models</code>（模型 SQL）。</p>
      <div id="model-deps" class="upstream-trees"></div>
    </div>

    <div class="panel" style="margin-top:16px">
      <h2><span class="step-badge">2</span>选择卡号列</h2>
      <select id="table-select" disabled>
        <option value="">— 先选择源表 —</option>
      </select>
      <div class="field-list" id="field-list">
        <div class="empty" style="padding:24px">请先载入数据</div>
      </div>
      <p class="hint">与所选列通过连接键直接或间接相连的源列都会换号。</p>
      <button class="btn-primary" id="btn-mask" disabled style="margin-top:14px">
        生成脱敏下载
      </button>
    </div>
  </div>

  <!-- 右侧：结果 -->
  <div class="panel">
    <h2><span class="step-badge">3</span>脱敏结果</h2>
    <div id="alert-box"></div>
    <div id="result-body">
      <div class="empty">
        <div class="big">🎭</div>
        <div>载入样本包并选择卡号列后，在此生成脱敏下载。<br>同一原号在包内换成同一新号，null 与其他字段原样保留。</div>
      </div>
    </div>
  </div>
</div>

<div class="loading-mask" id="loading">
  <div class="loading-box"><span class="spinner"></span><span id="loading-text">处理中…</span></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let payload = null;
let sourceName = "masked_payload.json";
let schemas = [];
let modelDeps = [];
let targetTable = "";
let targetColumn = "";
let lastMasked = null;
let lastFileName = "";

function setLoading(on, text) {
  $("loading").classList.toggle("show", on);
  if (text) $("loading-text").textContent = text;
}

function showAlert(kind, msg) {
  const box = $("alert-box");
  if (!msg) { box.innerHTML = ""; return; }
  const icon = kind === "error" ? "⛔" : kind === "ok" ? "✅" : "ℹ️";
  box.innerHTML = `<div class="alert alert-${kind}"><span>${icon}</span><span>${escapeHtml(msg)}</span></div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function postJSON(url, body) {
  const resp = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  try {
    return await resp.json();
  } catch (err) {
    return { ok: false, error: `服务返回异常（HTTP ${resp.status}），请查看服务日志。` };
  }
}

function maskedFileName() {
  const base = sourceName.replace(/\.json$/i, "");
  return `${base}.masked.json`;
}

async function loadPayload(data, label, fileLabel) {
  payload = data;
  sourceName = fileLabel;
  targetTable = ""; targetColumn = "";
  lastMasked = null;
  $("file-name").textContent = label;
  showAlert("", "");
  setLoading(true, "校验 JSON 与模型 SQL…");
  let res;
  try {
    res = await postJSON("/api/validate", payload);
  } catch (err) {
    showAlert("error", "请求失败：" + err.message);
    resetWorkspace();
    setLoading(false);
    return;
  }
  setLoading(false);
  if (!res.ok) {
    showAlert("error", res.error);
    resetWorkspace();
    $("result-body").innerHTML = `<div class="empty"><div class="big">⛔</div>
      <div>样本包校验未通过，请根据上方提示修正后重新载入。</div></div>`;
    return;
  }
  schemas = res.source_tables;
  modelDeps = res.models;
  renderTableSelect();
  renderModelDeps();
  renderFieldList();
  $("btn-mask").disabled = true;
  const totalRows = schemas.reduce((s, t) => s + t.row_count, 0);
  $("result-body").innerHTML = `<div class="empty"><div class="big">✅</div>
    <div>校验通过：${schemas.length} 张源表（共 ${totalRows} 行样本）、${modelDeps.length} 个模型。<br>请在左侧选择要换号的卡号列。</div></div>`;
}

function resetWorkspace() {
  schemas = []; modelDeps = [];
  $("table-select").innerHTML = '<option value="">— 先选择源表 —</option>';
  $("table-select").disabled = true;
  $("field-list").innerHTML = '<div class="empty" style="padding:24px">请先载入数据</div>';
  $("model-deps").innerHTML = "";
  $("btn-mask").disabled = true;
}

function renderTableSelect() {
  const sel = $("table-select");
  sel.innerHTML = '<option value="">— 选择源表 —</option>' +
    schemas.map(t => `<option value="${escapeHtml(t.table)}">${escapeHtml(t.table)}（${t.columns.length} 列 / ${t.row_count} 行）</option>`).join("");
  sel.disabled = false;
  sel.value = "";
}

function renderModelDeps() {
  if (!modelDeps.length) { $("model-deps").innerHTML = ""; return; }
  $("model-deps").innerHTML = "<div style='margin-bottom:6px;color:#667085'>模型读取关系：</div>" +
    modelDeps.map(m => {
      const ups = m.upstream.length
        ? m.upstream.map(u => `<span class="model-chip">${escapeHtml(u)}</span>`).join("")
        : '<span class="model-chip">仅源表</span>';
      return `<div style="margin:4px 0"><span class="model-chip" style="background:#e8efff;color:#1849a9">${escapeHtml(m.name)}</span><span class="arr">←</span>${ups}</div>`;
    }).join("");
}

function renderFieldList() {
  const table = $("table-select").value;
  targetTable = table;
  const box = $("field-list");
  if (!table) {
    box.innerHTML = '<div class="empty" style="padding:24px">请先选择源表</div>';
    return;
  }
  const t = schemas.find(x => x.table === table);
  box.innerHTML = t.columns.map(c =>
    `<label class="field-item" data-col="${escapeHtml(c)}">
       <input type="radio" name="target-col" value="${escapeHtml(c)}">
       <span>${escapeHtml(c)}</span>
     </label>`).join("");
  box.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("change", () => {
      targetColumn = inp.value;
      box.querySelectorAll(".field-item").forEach(el =>
        el.classList.toggle("target", el.dataset.col === targetColumn));
      $("btn-mask").disabled = false;
    });
  });
}

$("table-select").addEventListener("change", () => {
  targetColumn = "";
  renderFieldList();
  $("btn-mask").disabled = true;
});

$("file-input").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  setLoading(true, "读取文件…");
  try {
    const text = await file.text();
    let data;
    try { data = JSON.parse(text); }
    catch (err) {
      showAlert("error", "JSON 解析失败：" + err.message);
      setLoading(false);
      return;
    }
    await loadPayload(data, "已上传：" + file.name, file.name);
  } finally {
    setLoading(false);
    e.target.value = "";
  }
});

$("btn-sample").addEventListener("click", async () => {
  setLoading(true, "载入本地样例…");
  try {
    const resp = await fetch("/api/sample");
    const data = await resp.json();
    await loadPayload(data, "本地样例 sample_clearing.json", "sample_clearing.json");
  } finally {
    setLoading(false);
  }
});

function downloadMasked() {
  if (!lastMasked) return;
  const blob = new Blob([JSON.stringify(lastMasked, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = lastFileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

$("btn-mask").addEventListener("click", async () => {
  if (!targetTable || !targetColumn) return;
  setLoading(true, "追溯连接键并换号…");
  showAlert("", "");
  lastMasked = null;
  let res;
  try {
    const qs = `table=${encodeURIComponent(targetTable)}&column=${encodeURIComponent(targetColumn)}`;
    res = await postJSON("/api/mask?" + qs, payload);
  } catch (err) {
    showAlert("error", "请求失败：" + err.message);
    setLoading(false);
    return;
  }
  setLoading(false);
  if (!res.ok) {
    showAlert("error", res.error);
    $("result-body").innerHTML = `<div class="empty"><div class="big">⛔</div>
      <div>未生成下载，请根据上方提示修正后重试。</div></div>`;
    return;
  }
  lastMasked = res.masked;
  lastFileName = maskedFileName();
  renderSummary(res.summary);
  downloadMasked();
});

function renderSummary(s) {
  const cols = s.renumbered_columns.map(c => `
    <tr>
      <td class="col-name">${escapeHtml(c.table)}.${escapeHtml(c.column)}</td>
      <td>${c.rows}</td>
      <td>${c.replaced}</td>
      <td>${c.nulls}</td>
    </tr>`).join("");
  const preview = escapeHtml(JSON.stringify(lastMasked, null, 2).split("\n").slice(0, 60).join("\n"));
  $("result-body").innerHTML = `
    <div class="stats">
      <div class="stat"><div class="num">${s.column_count}</div><div class="lbl">换号源列</div></div>
      <div class="stat"><div class="num">${s.distinct_values}</div><div class="lbl">不同卡号</div></div>
      <div class="stat"><div class="num">${s.total_replaced}</div><div class="lbl">替换值（不含 null）</div></div>
    </div>
    <div class="alert alert-ok">
      <span>⬇️</span>
      <span>已生成 <b>${escapeHtml(lastFileName)}</b> 并开始下载。
      起点 <b>${escapeHtml(s.target.table)}.${escapeHtml(s.target.column)}</b>，
      与连接键连通的 ${s.column_count} 个源列已整体换号；下载文件不含原号对照。</span>
    </div>
    <table class="col-table">
      <thead><tr><th>换号源列</th><th>行数</th><th>替换值</th><th>保留 null</th></tr></thead>
      <tbody>${cols}</tbody>
    </table>
    <div class="btn-row" style="max-width:240px">
      <button class="btn" id="btn-redownload">再次下载</button>
    </div>
    <div class="meta-line">脱敏结果预览（前 60 行）：</div>
    <div class="preview">${preview}</div>`;
  $("btn-redownload").addEventListener("click", downloadMasked);
}
</script>
</body>
</html>
